<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container">
        <div class="slides">
            <img src="https://picsum.photos/id/1018/800/400" alt="Slide 1" class="slide active">
            <img src="https://picsum.photos/id/1015/800/400" alt="Slide 2" class="slide">
            <img src="https://picsum.photos/id/1019/800/400" alt="Slide 3" class="slide">
        </div>
        
        <!-- Navigation Buttons -->
        <button id="prevBtn" class="btn">❮</button>
        <button id="nextBtn" class="btn">❯</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
