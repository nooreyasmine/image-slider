<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Slider with Reordering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <!-- Message displayed when there are no images left -->
        <div id="noImagesMessage" class="empty-state" style="display:none;">
            <p>No images in the slider. Add one below!</p>
        </div>

        <div class="slider-container">
            <div class="slides">
                <img src="https://picsum.photos/id/1018/800/400" alt="Slide 1" class="slide active">
                <img src="https://picsum.photos/id/1015/800/400" alt="Slide 2" class="slide">
                <img src="https://picsum.photos/id/1019/800/400" alt="Slide 3" class="slide">
            </div>
            
            <!-- Navigation Buttons -->
            <button id="prevBtn" class="btn">❮</button>
            <button id="nextBtn" class="btn">❯</button>
        </div>

        <!-- Zoom Control Buttons -->
        <div class="zoom-controls">
            <button id="zoomInBtn" class="btn-zoom">Zoom In (+)</button>
            <button id="zoomOutBtn" class="btn-zoom">Zoom Out (-)</button>
        </div>

        <!-- Image Management Panel -->
        <div class="manage-controls">
            <!-- Add via Web URL -->
            <div class="add-group">
                <input type="text" id="imageUrlInput" placeholder="Paste image URL here...">
                <button id="addImageBtn" class="btn-manage btn-add">Add URL</button>
            </div>

            <!-- Add from local files -->
            <div class="file-group">
                <label for="imageFileInput" class="btn-manage btn-file">Choose Local Image</label>
                <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
            </div>

            <!-- Change Slide Sequence Order -->
            <div class="order-controls">
                <button id="moveLeftBtn" class="btn-manage btn-order">Move Slide Left ⬅</button>
                <button id="moveRightBtn" class="btn-manage btn-order">Move Slide Right ➡</button>
            </div>

            <!-- Delete slide -->
            <button id="deleteImageBtn" class="btn-manage btn-delete">Delete Current Slide</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
